<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>BouquetNote — Digital Bouquets &amp; Letters</title>
    <style>
      :root {
        --cream: #fbf7ef;
        --paper: #fffdf8;
        --forest: #173f35;
        --forest-soft: #41665a;
        --rose: #d95f6b;
        --rose-dark: #a9515c;
        --blush: #f2d8d7;
        --sage: #cad5c1;
        --gold: #e7b86b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: var(--cream);
        color: var(--forest);
        font-family: Georgia, 'Times New Roman', serif;
      }

      .cover {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 8% 10%, rgba(217, 95, 107, 0.13), transparent 27%),
          radial-gradient(circle at 94% 90%, rgba(202, 213, 193, 0.54), transparent 30%),
          var(--cream);
      }

      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(23, 63, 53, 0.18);
        border-radius: 26px;
        pointer-events: none;
      }

      .copy {
        position: absolute;
        z-index: 2;
        top: 96px;
        left: 92px;
        width: 610px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--forest);
        font-size: 31px;
        font-weight: 700;
        letter-spacing: -0.045em;
      }

      .brand-mark {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 34px;
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        content: '';
        display: block;
        border-radius: 100% 0 100% 0;
        background: var(--rose);
        transform: rotate(-38deg);
      }

      .brand-mark::before {
        top: 2px;
        left: 7px;
        width: 20px;
        height: 13px;
      }

      .brand-mark::after {
        top: 13px;
        left: 2px;
        width: 14px;
        height: 19px;
        background: var(--gold);
        transform: rotate(34deg);
      }

      .eyebrow {
        margin: 54px 0 18px;
        color: var(--rose-dark);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 620px;
        color: var(--forest);
        font-size: 64px;
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.99;
      }

      h1 em {
        color: var(--rose-dark);
        font-style: normal;
      }

      .domain {
        display: inline-block;
        margin-top: 42px;
        padding: 11px 19px 10px;
        border: 1px solid rgba(23, 63, 53, 0.2);
        border-radius: 999px;
        color: var(--forest);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .art {
        position: absolute;
        z-index: 1;
        top: 63px;
        right: 45px;
        width: 475px;
        height: 520px;
      }

      .seal {
        position: absolute;
        right: 94px;
        bottom: 68px;
        z-index: 3;
        display: grid;
        width: 70px;
        height: 70px;
        place-items: center;
        border: 1px solid rgba(23, 63, 53, 0.19);
        border-radius: 50%;
        color: var(--forest-soft);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.35;
        text-align: center;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="cover" role="img" aria-label="BouquetNote — Digital Bouquets &amp; Letters">
      <div class="frame" aria-hidden="true"></div>

      <section class="copy">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>BouquetNote</div>
        <p class="eyebrow">Digital Bouquets &amp; Letters</p>
        <h1>Flowers, words,<br /><em>and a link worth keeping.</em></h1>
        <div class="domain">bouquetnote.com</div>

        <g filter="url(#shadow)" transform="rotate(-8 326 365)">

      <div class="seal">made<br />to keep</div>
    </main>
  </body>
</html>
